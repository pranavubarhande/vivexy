name: deploy-k8s

# Fires after build-and-push succeeds on main. Runs `helm upgrade --install`
# against a cluster reached via the KUBECONFIG secret — cloud-agnostic, no
# AWS-specific OIDC/ECS assumptions (replaces the old deploy-aws.yml).
#
# The chart's pre-upgrade Helm hook (migrations-job.yaml) runs
# `alembic upgrade head` before any Deployment is touched, and --wait blocks
# this job until that hook succeeds and every Deployment is ready — so a
# failed migration fails this workflow instead of rolling forward broken
# code against an unmigrated schema.

on:
  workflow_run:
    workflows: [build-and-push]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to commit SHA from triggering build)"
        required: false
        default: ""
      values_env:
        description: "Which values-<env>.yaml overlay to deploy"
        required: false
        default: "prod"
        type: choice
        options: [prod, staging]

permissions:
  contents: read

env:
  GHCR_OWNER: ${{ github.repository_owner }}
  CHART_PATH: infra/k8s/charts/portfolio-helper
  NAMESPACE: portfolio-helper
  RELEASE_NAME: portfolio-helper

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.values_env || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            TAG="sha-${{ github.event.workflow_run.head_sha }}"
          else
            TAG="sha-${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${TAG}"

      - name: Set up kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        # KUBECONFIG secret: base64 of a kubeconfig for a service account
        # scoped to the ${{ env.NAMESPACE }} namespace (and the KEDA/
        # cert-manager/ingress-nginx resource types the chart manages there).
        # Works against any cluster (EKS, GKE, self-hosted) — nothing here
        # is cloud-specific.

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm dependency update
        run: helm dependency update "${CHART_PATH}"

      - name: Deploy
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          VALUES_ENV: ${{ inputs.values_env || 'prod' }}
        run: |
          helm upgrade --install "${RELEASE_NAME}" "${CHART_PATH}" \
            -f "${CHART_PATH}/values.yaml" \
            -f "${CHART_PATH}/values-${VALUES_ENV}.yaml" \
            --set image.owner="${GHCR_OWNER}" \
            --set image.tag="${IMAGE_TAG}" \
            --namespace "${NAMESPACE}" --create-namespace \
            --wait --timeout 10m

      - name: Show rollout status
        if: always()
        run: |
          kubectl -n "${NAMESPACE}" get pods -o wide
          kubectl -n "${NAMESPACE}" get scaledobject
          helm -n "${NAMESPACE}" status "${RELEASE_NAME}"
