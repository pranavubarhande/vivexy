name: deploy-koyeb

# Fires after build-and-push finishes on main.
# Pings Koyeb redeploy webhooks for agents-web and chat-worker.
# Vercel auto-deploys the frontend from the GitHub integration — no step needed here.

on:
  workflow_run:
    workflows: [build-and-push]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  redeploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy agents-web
        env:
          URL: ${{ secrets.KOYEB_AGENTS_REDEPLOY_URL }}
        run: |
          if [ -z "${URL}" ]; then
            echo "::warning::KOYEB_AGENTS_REDEPLOY_URL not set, skipping"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 -X POST "${URL}"

      - name: Redeploy chat-worker
        env:
          URL: ${{ secrets.KOYEB_WORKER_REDEPLOY_URL }}
        run: |
          if [ -z "${URL}" ]; then
            echo "::warning::KOYEB_WORKER_REDEPLOY_URL not set, skipping"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 -X POST "${URL}"
