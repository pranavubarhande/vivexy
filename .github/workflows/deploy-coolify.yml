name: deploy-coolify

# Fires after build-and-push finishes on main.
# Coolify pulls the new images and rolls the three services.

on:
  workflow_run:
    workflows: [build-and-push]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "${COOLIFY_WEBHOOK_URL}" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL secret is not set"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "${COOLIFY_WEBHOOK_URL}"
