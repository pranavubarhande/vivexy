name: release

# Publishes @vivexy/ui, @vivexy/core (npm), vivexy-agents-core (PyPI) and the
# Helm chart (oci://ghcr.io/<owner>/charts/vivexy) at one shared version. While the repository is private, a tag only runs
# `verify` (products pin the tag via git); publishing starts once it's public.
# Bump with `npm run release:version -- 0.2.0`, commit, then
# `git tag v0.2.0 && git push --tags`.
#
# One-time setup:
#   - npm: create the `vivexy` org and add an automation token as NPM_TOKEN.
#   - PyPI: add a trusted publisher for this repo, workflow `release.yml`,
#     environment `pypi`.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v3
      - run: node scripts/release-version.mjs --check "${GITHUB_REF_NAME}"

  npm:
    needs: verify
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm publish --provenance --workspace @vivexy/ui --workspace @vivexy/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: verify
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build --package vivexy-agents-core --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  chart:
    needs: verify
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: helm repo add minio https://charts.min.io/
      - run: helm dependency build infra/k8s/charts/vivexy
      - run: helm package infra/k8s/charts/vivexy --destination dist
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: helm push dist/vivexy-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
