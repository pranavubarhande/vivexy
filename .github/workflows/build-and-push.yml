name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: build-${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            image: vivexy-frontend
            dockerfile: infra/docker/frontend.Dockerfile
            cache-mode: max
          - service: agents-service
            image: vivexy-agents
            dockerfile: infra/docker/agents-service.Dockerfile
            cache-mode: min

    steps:
      - uses: actions/checkout@v4

      # agents-service pulls in build-essential + WeasyPrint/Playwright system
      # libs + a Chromium download; that plus a mode=max GHA cache routinely
      # exceeds the runner's ~14GB free disk (see build-and-push run history —
      # every agents-service build failed with ENOSPC). Reclaim space taken by
      # preinstalled toolchains this job never uses before building.
      - name: Free disk space
        if: matrix.service == 'agents-service'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker image prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=${{ matrix.cache-mode }},scope=${{ matrix.service }}
