name: build-and-push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'infra/k8s/charts/vivexy/image-tag/**'
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install node dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install agents-service Python dependencies
        run: cd apps/agents-service && uv sync --extra dev

      - name: Run tests (pytest + vitest via turbo)
        run: npm run test

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint
        run: |
          helm dependency update infra/k8s/charts/vivexy
          helm lint infra/k8s/charts/vivexy -f infra/k8s/charts/vivexy/values.yaml -f infra/k8s/charts/vivexy/values-dev.yaml
          helm lint infra/k8s/charts/vivexy -f infra/k8s/charts/vivexy/values.yaml -f infra/k8s/charts/vivexy/values-staging.yaml
          helm lint infra/k8s/charts/vivexy -f infra/k8s/charts/vivexy/values.yaml -f infra/k8s/charts/vivexy/values-prod.yaml

  build:
    name: build-${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            image: vivexy-frontend
            dockerfile: infra/docker/frontend.Dockerfile
            cache-mode: max
            build-args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
              NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
              NEXT_PUBLIC_AUTH_ENABLED=${{ vars.NEXT_PUBLIC_AUTH_ENABLED }}
              NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          - service: agents-service
            image: vivexy-agents
            dockerfile: infra/docker/agents-service.Dockerfile
            cache-mode: min
            build-args: ''

    steps:
      - uses: actions/checkout@v4

      # agents-service pulls in build-essential + WeasyPrint/Playwright system
      # libs + a Chromium download; that plus a mode=max GHA cache routinely
      # exceeds the runner's ~14GB free disk (see build-and-push run history —
      # every agents-service build failed with ENOSPC). Reclaim space taken by
      # preinstalled toolchains this job never uses before building.
      - name: Free disk space
        if: matrix.service == 'agents-service'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker image prune -af
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=${{ matrix.cache-mode }},scope=${{ matrix.service }}
          build-args: ${{ matrix.build-args }}
