name: desktop-release

# Builds unsigned installers for macOS / Windows / Linux and uploads them
# to a GitHub Release as draft. Promote to published manually when ready.
#
# Trigger:
#   git tag desktop-v0.1.0 && git push --tags
# Or manually via Actions → Run workflow.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as (e.g. desktop-v0.1.0)'
        required: true

permissions:
  contents: write # create release + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm install

      # apps/desktop depends on file:../../packages/desktop (copied in via
      # install-links), so the library must be built before installing.
      - name: Build @vivexy/desktop library
        working-directory: packages/desktop
        run: |
          npm ci --no-workspaces --ignore-scripts
          npm run build

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build frontend (static export) + Electron main process
        working-directory: apps/desktop
        env:
          # Points the desktop app at your production agents service.
          # Set this secret in: GitHub → Settings → Secrets → Actions
          NEXT_PUBLIC_API_URL: ${{ secrets.DESKTOP_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.DESKTOP_APP_URL }}
          NEXT_PUBLIC_AUTH_ENABLED: ${{ vars.DESKTOP_AUTH_ENABLED || 'true' }}
          # Stripe — leave empty if not used in desktop
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PAYMENT_LINK_PRO: ${{ vars.STRIPE_PAYMENT_LINK_PRO }}
          NEXT_PUBLIC_STRIPE_PAYMENT_LINK_ENTERPRISE: ${{ vars.STRIPE_PAYMENT_LINK_ENTERPRISE }}
          NEXT_PUBLIC_PRO_PRICE_USD: ${{ vars.PRO_PRICE_USD || '29' }}
          NEXT_PUBLIC_ENTERPRISE_PRICE_USD: ${{ vars.ENTERPRISE_PRICE_USD || '99' }}
          NEXT_DESKTOP: '1'
        run: npm run build:all

      - name: Build + publish installers
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always
