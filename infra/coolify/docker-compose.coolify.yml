# Coolify deployment — cheap path.
#
# Paste this into Coolify's "Docker Compose" app. Coolify provisions a reverse
# proxy (Traefik) and Let's Encrypt TLS based on the SERVICE_FQDN_* labels.
# All stateful dependencies (Postgres, Redis, RabbitMQ) are external managed
# services — see .env.coolify.example for signup links.
#
# IMAGE_TAG defaults to "latest"; override in Coolify env for pinned rollouts.

services:
  frontend:
    image: ghcr.io/${GHCR_OWNER}/portfolio-helper-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_PRICE_ID_PRO=${NEXT_PUBLIC_STRIPE_PRICE_ID_PRO}
      - NEXT_PUBLIC_STRIPE_PRICE_ID_ENTERPRISE=${NEXT_PUBLIC_STRIPE_PRICE_ID_ENTERPRISE}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - NEXT_PUBLIC_AUTH_ENABLED=${NEXT_PUBLIC_AUTH_ENABLED:-true}
      - NEXT_PUBLIC_WEB3FORMS_KEY=${NEXT_PUBLIC_WEB3FORMS_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SERVICE_FQDN_FRONTEND_3000
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5

  agents-service:
    image: ghcr.io/${GHCR_OWNER}/portfolio-helper-agents:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - USE_RABBITMQ=true
      - USE_REDIS_STREAM=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - EXA_API_KEY=${EXA_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - SANDBOX_ENABLED=${SANDBOX_ENABLED:-true}
      - DAYTONA_API_KEY=${DAYTONA_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SERVICE_FQDN_AGENTS_5000
    ports:
      - "5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  chat-worker:
    image: ghcr.io/${GHCR_OWNER}/portfolio-helper-agents:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "worker.consumer"]
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - USE_RABBITMQ=true
      - USE_REDIS_STREAM=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - EXA_API_KEY=${EXA_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - DAYTONA_API_KEY=${DAYTONA_API_KEY}
    deploy:
      replicas: 2
