# See ../prod/postgres-podmonitoring.yaml — same selector/port, different
# namespace (matches values-staging.yaml deploying to vivexy-staging).
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: postgresql-ha
  namespace: vivexy-staging
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql-ha
      app.kubernetes.io/component: postgresql
  endpoints:
    - port: metrics
      interval: 30s
