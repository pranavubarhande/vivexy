# Selector/port verified the same way as postgres-podmonitoring.yaml. The
# rabbitmq subchart is a single StatefulSet (app.kubernetes.io/name:
# rabbitmq) with the Prometheus plugin exposed directly on the main
# container as a port named "metrics" once rabbitmq.metrics.enabled is
# true — no separate exporter sidecar needed here (unlike postgres).
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: rabbitmq
  namespace: vivexy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  endpoints:
    - port: metrics
      interval: 30s
