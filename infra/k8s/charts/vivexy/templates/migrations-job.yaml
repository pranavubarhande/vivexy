{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrations-{{ .Release.Revision }}
  labels:
    {{- include "vivexy.labels" . | nindent 4 }}
  annotations:
    # pre-upgrade: blocks the rest of the rollout (via --wait in CI) until
    # this exits 0 — the k8s equivalent of deploy-aws.yml's one-shot
    # `aws ecs run-task` + `wait tasks-stopped` migration step, but expressed
    # as a native Helm hook instead of hand-rolled CI choreography. On an
    # upgrade, postgresql-ha is already running from the prior release, so
    # this blocks correctly before any Deployment gets the new image.
    #
    # post-install (NOT pre-install): a pre-install hook runs before ANY
    # other resource in the release exists — including the postgresql-ha
    # subchart's own StatefulSet, since that's just another resource in the
    # same release. On a genuinely fresh install there is no DB to connect
    # to yet, so a pre-install migration Job can only ever hang until
    # activeDeadlineSeconds kills it — this isn't a slow-start timing issue,
    # it's a hard chicken-and-egg with Helm's hook ordering. post-install
    # runs after postgresql-ha's Service/StatefulSet have been applied, so
    # combined with the wait-loop below (Postgres take a minute or two to
    # accept connections after that) it actually succeeds.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "vivexy.selectorLabels" (dict "component" "migrations" "root" $) | nindent 8 }}
    spec:
      restartPolicy: Never
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "vivexy.agentsImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- include "vivexy.composeConnectionUrls" . | nindent 14 }}
              PGHOST="{{ include "vivexy.postgresHost" . }}"
              echo "Waiting for Postgres ($PGHOST:5432) to accept connections..."
              for i in $(seq 1 60); do
                if python3 -c "import socket,sys; socket.create_connection((sys.argv[1], 5432), 3).close()" "$PGHOST" 2>/dev/null; then
                  echo "Postgres reachable (attempt $i/60)."
                  break
                fi
                echo "  not ready yet (attempt $i/60), retrying in 5s"
                sleep 5
              done
              exec uv run alembic upgrade head
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-agents-config
            - secretRef:
                name: {{ .Values.secrets.agents }}
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: postgres-password }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: redis-password }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: rabbitmq-password }
{{- end }}
