{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrations-{{ .Release.Revision }}
  labels:
    {{- include "vivexy.labels" . | nindent 4 }}
  annotations:
    # post-install,post-upgrade (NOT pre-install/pre-upgrade): a pre-install
    # hook runs before ANY other resource in the release exists — including
    # postgresql-ha's own StatefulSet — so on a fresh install there's no DB
    # to connect to yet and the Job can only hang until
    # activeDeadlineSeconds kills it. post-install/post-upgrade run after
    # the rest of the release's resources are applied, so combined with the
    # wait-loop below (Postgres takes a minute or two to accept connections)
    # it actually succeeds.
    #
    # Verified empirically under ArgoCD: it maps Helm hook annotations onto
    # its own PreSync/PostSync phases with no install-vs-upgrade distinction
    # — a resource carrying "pre-upgrade" gets treated as PreSync on every
    # sync, including the very first one. That deadlocked a live deploy
    # (this Job stuck waiting for Postgres, while Postgres itself was held
    # back as a regular resource behind this same "PreSync" hook). Using
    # post-upgrade instead of pre-upgrade avoids that under ArgoCD, at the
    # cost of no longer blocking app Deployments from rolling out ahead of
    # a migration on subsequent releases the way pre-upgrade did under
    # plain `helm upgrade --wait`.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "vivexy.selectorLabels" (dict "component" "migrations" "root" $) | nindent 8 }}
    spec:
      restartPolicy: Never
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "vivexy.agentsImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- include "vivexy.composeConnectionUrls" . | nindent 14 }}
              PGHOST="{{ include "vivexy.postgresHost" . }}"
              echo "Waiting for Postgres ($PGHOST:5432) to accept connections..."
              for i in $(seq 1 60); do
                if python3 -c "import socket,sys; socket.create_connection((sys.argv[1], 5432), 3).close()" "$PGHOST" 2>/dev/null; then
                  echo "Postgres reachable (attempt $i/60)."
                  break
                fi
                echo "  not ready yet (attempt $i/60), retrying in 5s"
                sleep 5
              done
              {{- range .Values.migrations.commands }}
              {{ . }}
              {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-agents-config
            - secretRef:
                name: {{ .Values.secrets.agents }}
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: postgres-password }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: redis-password }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: rabbitmq-password }
{{- end }}
