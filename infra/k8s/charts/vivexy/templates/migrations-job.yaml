{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrations-{{ .Release.Revision }}
  labels:
    {{- include "vivexy.labels" . | nindent 4 }}
  annotations:
    # Runs before every install/upgrade and blocks the rest of the rollout
    # (via --wait in CI) until it exits 0 — the k8s equivalent of
    # deploy-aws.yml's one-shot `aws ecs run-task` + `wait tasks-stopped`
    # migration step, but expressed as a native Helm hook instead of
    # hand-rolled CI choreography.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "vivexy.selectorLabels" (dict "component" "migrations" "root" $) | nindent 8 }}
    spec:
      restartPolicy: Never
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "vivexy.agentsImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- include "vivexy.composeConnectionUrls" . | nindent 14 }}
              exec uv run alembic upgrade head
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-agents-config
            - secretRef:
                name: {{ .Values.secrets.agents }}
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: postgres-password }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: redis-password }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: rabbitmq-password }
{{- end }}
