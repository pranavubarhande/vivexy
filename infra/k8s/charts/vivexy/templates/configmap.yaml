apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-agents-config
  labels:
    {{- include "vivexy.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.agents.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  AWS_S3_ENDPOINT_URL: {{ include "vivexy.minioEndpoint" . | quote }}
  AWS_S3_BUCKET_NAME: {{ (first .Values.minio.buckets).name | quote }}
  AWS_S3_REGION: {{ .Values.agents.s3Region | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-config
  labels:
    {{- include "vivexy.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.frontend.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
