apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agents
  labels:
    {{- include "vivexy.labels" . | nindent 4 }}
    {{- include "vivexy.selectorLabels" (dict "component" "agents" "root" $) | nindent 4 }}
spec:
  {{- if not .Values.agents.autoscaling.enabled }}
  replicas: {{ .Values.agents.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vivexy.selectorLabels" (dict "component" "agents" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vivexy.selectorLabels" (dict "component" "agents" "root" $) | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: agents
          image: {{ include "vivexy.agentsImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- include "vivexy.composeConnectionUrls" . | nindent 14 }}
              exec gunicorn --bind 0.0.0.0:{{ .Values.agents.containerPort }} --workers 2 --threads 4 --timeout 120 --access-logfile - {{ .Values.agents.wsgiApp }}
          ports:
            - name: http
              containerPort: {{ .Values.agents.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-agents-config
            - secretRef:
                name: {{ .Values.secrets.agents }}
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: postgres-password }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: redis-password }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: rabbitmq-password }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: minio-root-user }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: minio-root-password }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.agents.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agents
  labels:
    {{- include "vivexy.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vivexy.selectorLabels" (dict "component" "agents" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.agents.containerPort }}
---
{{- if .Values.agents.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-agents
  labels:
    {{- include "vivexy.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-agents
  minReplicas: {{ .Values.agents.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.agents.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.agents.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
{{- if .Values.agents.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-agents
  labels:
    {{- include "vivexy.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.agents.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "vivexy.selectorLabels" (dict "component" "agents" "root" $) | nindent 6 }}
{{- end }}
