# Default values for the vivexy umbrella chart.
# Override per-environment via values-dev.yaml / values-staging.yaml / values-prod.yaml:
#   helm upgrade --install vivexy . -f values.yaml -f values-prod.yaml \
#     --set image.tag=$IMAGE_TAG -n vivexy --create-namespace

# ---------------------------------------------------------------------------
# Images
# ---------------------------------------------------------------------------
image:
  registry: ghcr.io
  owner: CHANGE_ME # GHCR owner/org — e.g. the repo owner from build-and-push.yml
  agentsRepository: vivexy-agents
  frontendRepository: vivexy-frontend
  tag: latest # overridden by CI: --set image.tag=sha-<commit>
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-credentials # kubectl create secret docker-registry ghcr-credentials ...

global:
  security:
    allowInsecureImages: true

# ---------------------------------------------------------------------------
# App secrets (created out-of-band — see infra/k8s/README.md). Referenced by
# name only; no secret values live in this chart.
# ---------------------------------------------------------------------------
secrets:
  # DB/Redis/RabbitMQ app-level credentials this chart also feeds into the
  # postgresql-ha / redis / rabbitmq subcharts below via existingSecret, so
  # the same password is used on both ends without ever appearing in values.
  dataCredentials: data-credentials # keys: postgres-password, redis-password, rabbitmq-password
  agents: agents-secrets # JWT_SECRET_KEY, SECRET_KEY, *_API_KEY, DAYTONA_API_KEY, SENTRY_DSN, S3 creds, ...
  frontend: frontend-secrets # NEXTAUTH_SECRET, JWT_SECRET, STRIPE_*, SMTP_*, ...

# ---------------------------------------------------------------------------
# Frontend (Next.js)
# ---------------------------------------------------------------------------
frontend:
  replicaCount: 2
  containerPort: 3000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  env:
    NODE_ENV: production
    NEXT_PUBLIC_AUTH_ENABLED: "true"
    # NEXT_PUBLIC_APP_URL / NEXTAUTH_URL / NEXT_PUBLIC_API_URL are set per
    # environment in values-{dev,staging,prod}.yaml since they're hostnames.

# ---------------------------------------------------------------------------
# Agents API (Flask/gunicorn)
# ---------------------------------------------------------------------------
agents:
  replicaCount: 2
  containerPort: 5000
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  env:
    FLASK_ENV: production
    PORT: "5000"
    USE_RABBITMQ: "true"
    USE_REDIS_STREAM: "true"
    SANDBOX_ENABLED: "true"
    # DB_POOL_SIZE / DB_POOL_MAX_OVERFLOW (configs/flask_config.py): keep
    # (agents.replicaCount x gunicorn workers=2 x (pool_size+max_overflow))
    # comfortably under pgpool's max client connections (see postgresql-ha
    # values below) — defaults here assume pgpool max ~200 and up to 20
    # agents pods at full HPA scale-out: 20 x 2 x (5+5) = 400, so trim pool
    # size down from the app default (5/5) when running near max replicas.
    DB_POOL_SIZE: "3"
    DB_POOL_MAX_OVERFLOW: "2"

# ---------------------------------------------------------------------------
# Worker (RabbitMQ consumer — chat_jobs / rag_jobs / scheduled_task_jobs)
# ---------------------------------------------------------------------------
worker:
  # Base replica count before KEDA takes over; KEDA's minReplicaCount below
  # is what actually governs steady-state once the ScaledObject is active.
  replicaCount: 1
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  # Generous grace period: worker/consumer.py catches SIGTERM and stops
  # consuming NEW messages but finishes whatever job is already in flight
  # (see worker/consumer.py::_handle_sigterm) — this bounds how long k8s
  # waits before SIGKILL during a rolling deploy or KEDA scale-down.
  terminationGracePeriodSeconds: 300
  keda:
    enabled: true
    pollingInterval: 15
    cooldownPeriod: 120
    minReplicaCount: 1
    maxReplicaCount: 20
    # One trigger per queue — KEDA scales to whichever trigger demands the
    # most replicas, mirroring the ECS queue_depth policy this replaces.
    queues:
      - name: chat_jobs
        queueLength: "10" # target avg messages per worker, latency-sensitive
      - name: rag_jobs
        queueLength: "25"
      - name: scheduled_task_jobs
        queueLength: "25"

# ---------------------------------------------------------------------------
# Scheduler (worker/scheduler.py — polls scheduled_tasks, SELECT FOR UPDATE
# SKIP LOCKED makes it safe to run >1 replica; fixed count, no HPA/KEDA)
# ---------------------------------------------------------------------------
scheduler:
  replicaCount: 2
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 500m, memory: 1Gi }

# ---------------------------------------------------------------------------
# Migrations (Helm hook Job — `alembic upgrade head`, blocks the rollout)
# ---------------------------------------------------------------------------
migrations:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 1800

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  clusterIssuer: letsencrypt-prod # cert-manager ClusterIssuer, see bootstrap/
  frontendHost: CHANGE_ME.example.com
  apiHost: CHANGE_ME-api.example.com
  tlsSecretFrontend: vivexy-frontend-tls
  tlsSecretApi: vivexy-api-tls

networkPolicy:
  enabled: true

# ---------------------------------------------------------------------------
# In-cluster data services (Bitnami/community subcharts — see Chart.yaml note
# on version drift). All three app-facing passwords come from the SAME
# `secrets.dataCredentials` Secret (see above) so the app and the subchart
# always agree, without the password ever appearing in this file.
#
# IMPORTANT: the exact field paths below (auth.existingSecret,
# postgresql.existingSecret, etc.) follow each chart's documented convention
# at time of writing, but Bitnami schemas do shift between versions — run
# `helm show values oci://registry-1.docker.io/bitnamicharts/<name>` for the
# version pinned in Chart.yaml and reconcile field names before first
# deploy, especially for postgresql-ha (repmgr + pgpool add extra
# password fields beyond the single app-user password referenced here).
# ---------------------------------------------------------------------------

postgresql-ha:
  enabled: true
  # Broadcom deprecated the free `bitnami/*` images on Docker Hub in 2025 —
  # postgresql-repmgr/pgpool/postgres-exporter/os-shell under that namespace
  # return zero tags now (confirmed via the Docker Hub API), which fails
  # every pod with ImagePullBackOff regardless of which tag is pinned above.
  # `bitnamilegacy/*` is Bitnami's own migration-bridge org holding the same
  # images/tags frozen as of the deprecation — verified each exact tag below
  # still resolves there. Swap to Bitnami Secure Images (paid) or a
  # different Postgres-HA chart if bitnamilegacy is ever pulled too.
  postgresql:
    image:
      repository: bitnamilegacy/postgresql-repmgr
    username: vivexy
    database: vivexy
    existingSecret: data-credentials
    # This chart version (16.0.4) has NO secretKeys-style remapping despite
    # earlier comments here claiming otherwise (verified against the actual
    # templates, not just `helm show values` — there's no `secretKeys` block
    # at all in postgresql-ha's schema). With existingSecret set, the exact
    # key names it looks for are fixed: `postgres-password` and
    # `repmgr-password` — both already present in `data-credentials`.
    # `postgresql.postgresPassword` / `.repmgrPassword` MUST stay unset here:
    # passing either as a plain value (e.g. via --set) alongside
    # existingSecret trips a chart bug where the StatefulSet's volumeMounts
    # reference a volume that was never defined
    # ("volumeMounts[6].name: Not found: postgres-password") — the
    # existingSecret's `postgres-password`/`repmgr-password` keys are picked
    # up correctly on their own via a `lookup()` the chart does against the
    # live Secret at render time, no extra values needed.
    usePasswordFiles: false # direct secretKeyRef env vars — sidesteps the volume-mount bug above entirely
    replicaCount: 3 # 1 primary + 2 replicas — total node count, NOT "extra replicas beyond primary"
  pgpool:
    image:
      repository: bitnamilegacy/pgpool
    replicaCount: 2
    # pgpool is what makes read replicas actually useful: it transparently
    # sends writes to the primary and load-balances reads across standbys,
    # so the Flask app needs zero read/write-split code — see agents.env
    # DB_POOL_SIZE comment above for how pod counts relate to this.
    customUsers:
      # pgpool needs its own admin credentials distinct from the DB user;
      # verify exact field name against the pinned chart version.
      existingSecret: data-credentials
  metrics:
    image:
      repository: bitnamilegacy/postgres-exporter
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  # `postgresqlPrimary`/`postgresqlReplicas` (used to be here) are NOT real
  # fields in this chart version — confirmed by extracting the actual chart
  # and reading templates/postgresql/statefulset.yaml + values.yaml, not
  # just `helm show values` comments. Helm silently ignores unknown keys, so
  # this was quietly a no-op: every install ran on the chart's actual
  # default (postgresql.replicaCount: 3) regardless of what was written
  # here. There's ONE postgres StatefulSet (primary + replicas together,
  # repmgr promotes among them, see postgresql.replicaCount above) sharing
  # ONE persistence block — top-level here, NOT nested under `postgresql:`.
  persistence:
    enabled: true
    size: 20Gi

redis:
  enabled: true
  # Same bitnami -> bitnamilegacy story as postgresql-ha/rabbitmq above —
  # the pinned redis tag (8.0.2-debian-12-r4) returns "not found" even
  # though the bitnami/redis repo itself is still otherwise alive.
  image:
    repository: bitnamilegacy/redis
  architecture: replication
  auth:
    enabled: true
    existingSecret: data-credentials
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 8Gi
  # NOTE (documented, not silently glossed over): replication-only gives
  # crash recovery (StatefulSet restarts pod-0 as master) but not automatic
  # failover promotion — that needs `sentinel.enabled: true` plus a
  # Sentinel-aware client in app/agents/pubsub.py and
  # app/business_logic/streaming.py (currently plain redis.from_url).
  # Left as a fast-follow rather than silently claimed here.
  sentinel:
    enabled: false

rabbitmq:
  enabled: true
  # Same bitnami -> bitnamilegacy story as postgresql-ha above — see that
  # block's comment. bitnami/rabbitmq and bitnami/os-shell return zero tags
  # on Docker Hub now; bitnamilegacy still serves the exact tags this chart
  # version pins.
  image:
    repository: bitnamilegacy/rabbitmq
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  replicaCount: 3
  auth:
    username: user
    existingPasswordSecret: data-credentials
    existingSecretPasswordKey: rabbitmq-password # verify field name against `helm show values` for pinned version
  persistence:
    enabled: true
    size: 10Gi
  clustering:
    forceBoot: true

minio:
  enabled: true
  mode: distributed
  replicas: 4
  existingSecret: data-credentials
  # Confirmed against the actual chart (charts.min.io minio 5.4.0): .data.rootUser
  # and .data.rootPassword are MANDATORY fixed key names with no remapping
  # option. `data-credentials` must carry both of these keys IN ADDITION to
  # minio-root-user/minio-root-password (which agents-deployment.yaml reads
  # directly for AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) — same values,
  # duplicated under both key names. See infra/k8s/README.md step 1, which
  # needs updating to create rootUser/rootPassword alongside the
  # minio-root-user/minio-root-password it already documents.
  persistence:
    enabled: true
    size: 50Gi
  buckets:
    - name: vivexy-uploads
      policy: none
      purge: false
