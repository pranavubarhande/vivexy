{{/*
Scope: ingress-only restriction between pods in this namespace. Egress is
deliberately left open — the agents/worker pods call a long, frequently
changing list of external APIs (LLM providers, Pinecone, Daytona, Composio,
Exa, GitHub, Stripe, SMTP, Sentry, ...) and a hand-maintained egress
allowlist here would be easy to get wrong in a way that silently breaks a
tool integration. Tightening egress is a reasonable follow-up once the
actual external dependency list is stable, ideally generated from
observed traffic rather than guessed.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny-ingress
  labels:
    {{- include "portfolio-helper.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-ingress-to-frontend
  labels:
    {{- include "portfolio-helper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "portfolio-helper.selectorLabels" (dict "component" "frontend" "root" $) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {} # ingress-nginx controller (any namespace) + same-namespace pods
      ports:
        - port: {{ .Values.frontend.containerPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-ingress-to-agents
  labels:
    {{- include "portfolio-helper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "portfolio-helper.selectorLabels" (dict "component" "agents" "root" $) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {} # ingress-nginx controller + frontend calling the API
      ports:
        - port: {{ .Values.agents.containerPort }}
{{- end }}
