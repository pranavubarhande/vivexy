apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "portfolio-helper.labels" . | nindent 4 }}
    {{- include "portfolio-helper.selectorLabels" (dict "component" "worker" "root" $) | nindent 4 }}
spec:
  {{- if not .Values.worker.keda.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "portfolio-helper.selectorLabels" (dict "component" "worker" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "portfolio-helper.selectorLabels" (dict "component" "worker" "root" $) | nindent 8 }}
    spec:
      # Paired with worker/consumer.py's SIGTERM handler (stop consuming NEW
      # messages, let the in-flight job finish and ack/nack normally) — this
      # is what lets a rolling deploy or KEDA scale-down avoid killing a
      # chat/RAG job mid-flight. RabbitMQ redelivers if we're SIGKILLed
      # anyway, but a clean drain avoids the wasted work and duplicate
      # side effects that redelivery implies.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "portfolio-helper.agentsImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              {{- include "portfolio-helper.composeConnectionUrls" . | nindent 14 }}
              exec python -m worker.consumer
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-agents-config
            - secretRef:
                name: {{ .Values.secrets.agents }}
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: postgres-password }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: redis-password }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: rabbitmq-password }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: minio-root-user }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.dataCredentials }}, key: minio-root-password }
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
