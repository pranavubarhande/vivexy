# See prod/frontend-secrets.yaml's note re: NEXT_PUBLIC_SENTRY_DSN — it's a
# build-time GitHub Actions variable, not a runtime secret, so it doesn't
# belong here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: frontend-secrets
  namespace: vivexy-staging
spec:
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: frontend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: vivexy-staging-frontend-secrets
