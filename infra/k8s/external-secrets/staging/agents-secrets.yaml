apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agents-secrets
  namespace: vivexy-staging
spec:
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: agents-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: vivexy-staging-agents-secrets
