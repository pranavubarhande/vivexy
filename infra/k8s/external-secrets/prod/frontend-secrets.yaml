# NOTE: does NOT carry NEXT_PUBLIC_SENTRY_DSN. That var is inlined into the
# frontend's client JS bundle at `next build` time (same mechanism as
# NEXT_PUBLIC_API_URL/NEXT_PUBLIC_APP_URL/NEXT_PUBLIC_AUTH_ENABLED — see
# infra/docker/frontend.Dockerfile) — a runtime Secret can never reach it.
# It's a GitHub Actions repo *variable* instead (Sentry DSNs are meant to be
# public/embeddable), consumed as a Docker build-arg. See the CI workflow.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: frontend-secrets
  namespace: vivexy
spec:
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: frontend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: vivexy-prod-frontend-secrets
