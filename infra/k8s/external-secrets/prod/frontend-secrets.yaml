apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: frontend-secrets
  namespace: vivexy
spec:
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: frontend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: vivexy-prod-frontend-secrets
