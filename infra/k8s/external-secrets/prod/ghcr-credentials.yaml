# Shared across environments — same GHCR PAT for prod and staging, unlike
# the DB/Redis/RabbitMQ passwords in data-credentials.yaml which are
# independent per environment. The Secret Manager value is the raw
# .dockerconfigjson content itself (see infra/k8s/external-secrets/README.md
# for how to produce it).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: vivexy
spec:
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: ghcr-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: vivexy-ghcr-credentials
