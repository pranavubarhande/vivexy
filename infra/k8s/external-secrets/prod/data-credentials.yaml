apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: data-credentials
  namespace: vivexy
spec:
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: data-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: vivexy-prod-data-credentials
