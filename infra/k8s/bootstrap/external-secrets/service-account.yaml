# The Kubernetes ServiceAccount External Secrets Operator runs as. Workload
# Identity binds this to the GCP service account provisioned by
# infra/terraform/modules/workload-identity-eso — no key file, no
# auth.secretRef credential, ever touches the cluster.
#
# Replace <PROJECT_ID> with your GCP project ID (or the value of
# `terraform output eso_gsa_email` verbatim, which already has the right
# format: eso-secret-manager@<PROJECT_ID>.iam.gserviceaccount.com).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-secret-manager
  namespace: external-secrets
  annotations:
    iam.gke.io/gcp-service-account: eso-secret-manager@<PROJECT_ID>.iam.gserviceaccount.com
