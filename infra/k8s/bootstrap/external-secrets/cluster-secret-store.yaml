apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: <PROJECT_ID>
      auth:
        workloadIdentity:
          clusterLocation: <ZONE>
          clusterName: <CLUSTER_NAME>
          serviceAccountRef:
            name: eso-secret-manager
            namespace: external-secrets
