# One cluster-scoped SecretStore, shared by every environment/namespace.
# Auth is entirely via Workload Identity (service-account.yaml in this same
# directory) — no credentials file, no auth.secretRef Secret to manage.
#
# Replace <PROJECT_ID> and <ZONE>/<CLUSTER_NAME> with the values from
# `terraform output` (infra/terraform/).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: <PROJECT_ID>
      auth:
        workloadIdentity:
          clusterLocation: <ZONE>
          clusterName: <CLUSTER_NAME>
          serviceAccountRef:
            name: eso-secret-manager
            namespace: external-secrets
