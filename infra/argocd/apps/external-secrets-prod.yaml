# Syncs infra/k8s/external-secrets/prod/ (plain manifests, not Helm) into
# the vivexy namespace. Kept as a separate Application from vivexy-prod
# deliberately — independent sync ordering (secrets can exist before/
# independently of the app release) and independent blast radius if one
# ever needs `argocd app delete` on its own.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pranavubarhande/vivexy.git
    targetRevision: main
    path: infra/k8s/external-secrets/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: vivexy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
