# Deliberately NOT kube-prometheus-stack, which would run a second
# Prometheus + Alertmanager + node-exporter DaemonSet — meaningful CPU/
# memory cost on a small autoscaling node pool (infra/terraform/) that's
# also running Postgres-HA/RabbitMQ/MinIO/Redis-Stack/the app itself. This
# is Grafana alone, as a query UI on top of the Prometheus data GKE already
# collects for free (monitoring_config.managed_prometheus in
# infra/terraform/modules/gke-cluster) via the query-frontend proxy
# (../k8s/observability/gmp-frontend.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15 # `helm search repo grafana/grafana` — verified current at authoring time, re-check before a real deploy
    helm:
      valuesObject:
        replicas: 1
        persistence:
          enabled: true
          size: 2Gi
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 500m, memory: 512Mi }
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: GKE Managed Prometheus
                type: prometheus
                access: proxy
                url: http://frontend.gmp-system.svc.cluster.local:9090
                isDefault: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
