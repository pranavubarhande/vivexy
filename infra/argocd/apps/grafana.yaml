apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      valuesObject:
        replicas: 1
        persistence:
          enabled: true
          size: 2Gi
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 500m, memory: 512Mi }
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: GKE Managed Prometheus
                type: prometheus
                access: proxy
                url: http://frontend.gmp-system.svc.cluster.local:9090
                isDefault: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
