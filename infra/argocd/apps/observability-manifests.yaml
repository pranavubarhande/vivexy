apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pranavubarhande/vivexy.git
    targetRevision: main
    path: infra/k8s/observability
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: gmp-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
