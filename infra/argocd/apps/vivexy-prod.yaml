# image-tag/prod.yaml (inside the chart directory, not referenced via `../`)
# is what CI writes to on every successful build — see
# .github/workflows/update-image-tag.yml. It lives inside spec.source.path
# specifically because ArgoCD's Helm source restricts valueFiles to paths
# under that directory by default (path-traversal protection) — this
# sidesteps that entirely rather than needing an exception.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vivexy-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pranavubarhande/vivexy.git
    targetRevision: main
    path: infra/k8s/charts/vivexy
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
        - image-tag/prod.yaml
      parameters:
        - name: image.owner
          value: pranavubarhande
  destination:
    server: https://kubernetes.default.svc
    namespace: vivexy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
