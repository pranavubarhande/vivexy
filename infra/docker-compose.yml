version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: portfolio_helper
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/portfolio_helper
    depends_on:
      - postgres
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules
    command: npm run dev

  agents-service:
    build:
      context: ../apps/agents-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/portfolio_helper
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672
      - USE_RABBITMQ=true
      - USE_REDIS_STREAM=false
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ../apps/agents-service:/app
    command: python app.py

  chat-worker:
    build:
      context: ../apps/agents-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/portfolio_helper
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://user:password@rabbitmq:5672
      - USE_RABBITMQ=true
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ../apps/agents-service:/app
    command: python -m worker.consumer
    deploy:
      replicas: 2

volumes:
  postgres_data:
  rabbitmq_data:
