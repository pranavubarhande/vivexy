[tool.poetry]
name = "agents-service"
version = "0.1.0"
description = "AI Agents service for portfolio helper"
authors = ["Pranav Ubarhande <pranavubarhande@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
flask = "^3.0.0"
flask-cors = "^4.0.0"
flask-sqlalchemy = "^3.1.1"
python-dotenv = "^1.0.0"
psycopg2-binary = "^2.9.0"
redis = "^5.0.0"
langchain = "1.2.0"
langchain-core = "1.2.6"
langchain-google-genai = "4.1.2"
langchain-community = "0.4.1"
langchain-huggingface = "1.2.0"
sentence_transformers = "5.2.0"
rank-bm25 = "0.2.2"
unstructured = "0.18.26"
pypdf = "6.5.0"
openpyxl = "3.1.5"
python-docx = "1.2.0"
langgraph = "1.0.5"
pinecone-client = "^5.0.0"
pandas = "^2.0.0"
pydantic = "^2.5.0"
bcrypt = "^4.1.2"
pyjwt = "^2.8.0"
alembic = "^1.13.0"
yfinance = "^0.2.0"
requests = "^2.31.0"
boto3 = "^1.42.43"
reportlab = "^4.0.0"
langchain-groq = "^1.1.0"
langchain-openai = "^1.1.0"
langchain-anthropic = "^1.1.0"
composio-langchain = "^0.11.1"
pypandoc = "^1.16.2"
markdown2 = "^2.5.4"
weasyprint = "^68.1"
pika = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"
isort = "^5.0.0"
flake8 = "^7.0.0"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["agents_service"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"