[project]
name = "agents-service"
version = "0.1.0"
description = "AI Agents service for Vivexy"
authors = [{name = "Pranav Ubarhande", email = "pranavubarhande@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flasgger",
    "sentry-sdk[flask]>=2.54.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "vivexy-agents-core",
]

[tool.uv.sources]
vivexy-agents-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.0.0",
    "flake8>=7.0.0",
    "pytest-flask>=1.3.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["agents_service"]

[tool.hatch.build.targets.wheel]
packages = []
