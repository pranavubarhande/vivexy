[alembic]
# path to migration scripts
script_location = agents_core:migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, it must be a valid Python timezone identifier.
# Defaults to UTC. Can be overridden in the migration file.
timezone = UTC

# max length of characters to apply to the
# migration file template
# (only affects the autogenerate template)
truncate_slug_length = 40

# set to 'true' to run the environment file as a
# standalone script, false to use exec() (default: false)
# (works only with single process)
run_as_script = false

# revision environment configuration
revision_environment = false

# enable logging of the SQL generated by alembic
# (only useful for debugging)
# logging of SQL can be enabled/disabled per migration
# by setting alembic.logging_enabled = True/False
# in the migration file
sqlalchemy.url = driver://user:pass@localhost/dbname

# set the default encoding for migration files
# (default: utf-8)
encoding = utf-8

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S