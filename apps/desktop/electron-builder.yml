appId: com.portfolio-helper.desktop
productName: Portfolio Helper
copyright: Copyright © 2026

directories:
  output: release

files:
  - "dist/**/*"
  - "package.json"
  - "!**/*.ts"
  - "!**/*.map"

# Unsigned builds — users will see Gatekeeper / SmartScreen warnings on
# first launch. Upgrade to signing later (Apple Dev $99/yr + Windows EV cert).
mac:
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.finance
  identity: null # don't code-sign
  hardenedRuntime: false

dmg:
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office

publish:
  provider: github
  releaseType: draft
