[project]
name = "vivexy-agents-core"
version = "0.3.0"
description = "Core agent orchestration, tools, and business logic for Vivexy"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.0.0,<2.1",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "langchain==1.2.0",
    "langchain-core>=1.2.6",
    "langchain-google-genai==4.1.2",
    "langchain-community==0.4.1",
    "langchain-huggingface==1.2.0",
    "sentence_transformers==5.2.0",
    "rank-bm25==0.2.2",
    "pypdf==6.5.0",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "langgraph==1.0.5",
    "pinecone>=5.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
    "authlib>=1.3.2",
    "resend>=2.5.1",
    "yfinance>=0.2.0",
    "requests>=2.31.0",
    "boto3>=1.42.43",
    "reportlab>=4.0.0",
    "langchain-groq>=1.1.0",
    "langchain-openai>=1.1.0",
    "langchain-anthropic>=1.1.0",
    "langchain-mistralai>=0.2.0",
    "langchain-together>=0.4.0",
    "langchain-fireworks>=0.2.0",
    "langchain-cohere>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-xai>=0.2.0",
    "cryptography>=43.0.0",
    "composio-langchain>=0.11.1",
    "pypandoc>=1.16.2",
    "markdown2>=2.5.4",
    "weasyprint>=68.1",
    "pika>=1.3.0",
    "sentry-sdk[flask]>=2.54.0",
    "deepagents>=0.3.3",
    "langchain-daytona>=0.0.2",
    "daytona>=0.18.1",
    "exa-py>=0.1.8",
    "crawl4ai>=0.4.0",
    "playwright>=1.48.0",
    "flasgger",
    "langgraph-checkpoint-redis>=0.3.6",
    "httpx>=0.27.0",
    "stripe>=11.0.0",
    "dnspython>=2.6.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
]

[project.urls]
Repository = "https://github.com/pranavubarhande/vivexy"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.0.0",
    "flake8>=7.0.0",
    "pytest-flask>=1.3.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["agents_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_core"]
exclude = ["**/__tests__"]
